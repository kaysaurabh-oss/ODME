# ==============================
# ODME Angel Cloud App Secrets
# ==============================
# This is only a TEMPLATE.
# Do not put real credentials in GitHub.
# Real values must be pasted in Streamlit Cloud:
# App → Settings → Secrets

ANGEL_API_KEY = "PASTE_ANGEL_API_KEY_HERE"
ANGEL_CLIENT_ID = "PASTE_ANGEL_CLIENT_ID_HERE"
ANGEL_PIN = "PASTE_ANGEL_PIN_HERE"

USE_GOOGLE_SHEETS = true
GOOGLE_SHEET_NAME = "ODME_Angel_Memory"

[gcp_service_account]
type = "service_account"
project_id = "PASTE_PROJECT_ID_HERE"
private_key_id = "PASTE_PRIVATE_KEY_ID_HERE"
private_key = "-----BEGIN PRIVATE KEY-----\nPASTE_PRIVATE_KEY_HERE\n-----END PRIVATE KEY-----\n"
client_email = "PASTE_SERVICE_ACCOUNT_EMAIL_HERE"
client_id = "PASTE_CLIENT_ID_HERE"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "PASTE_CLIENT_X509_CERT_URL_HERE"
universe_domain = "googleapis.com"
